<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Animação – Projeto Armário com Rodas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif}
#wrap{width:min(920px,100vw);padding:14px}
h1{color:#f39c12;text-align:center;font-size:clamp(14px,2.5vw,22px);margin-bottom:12px;letter-spacing:1px}
#stage-box{position:relative;aspect-ratio:900/506;width:100%;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
#stage{width:100%;height:100%;display:block}
#dlg-wrap{position:absolute;bottom:7%;left:50%;transform:translateX(-50%);width:86%;background:rgba(255,255,255,0.97);border-radius:14px;padding:14px 22px;border-left:7px solid #e67e22;box-shadow:0 6px 30px rgba(0,0,0,0.35);opacity:0;transition:opacity 0.5s ease;z-index:30;min-height:56px}
#dlg-wrap.show{opacity:1}
#spk{font-size:clamp(10px,1.6vw,13px);font-weight:700;color:#e67e22;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
#txt{font-size:clamp(13px,1.9vw,18px);color:#2c3e50;line-height:1.5;min-height:1.4em}
#slbl{position:absolute;top:7%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);color:#fff;padding:6px 18px;border-radius:22px;font-size:clamp(10px,1.5vw,14px);font-weight:700;z-index:30;opacity:0;transition:opacity 0.5s;white-space:nowrap;pointer-events:none}
#slbl.vis{opacity:1}
#ctrl{display:flex;align-items:center;gap:10px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.btn{background:#e67e22;color:#fff;border:none;border-radius:9px;padding:9px 22px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:inherit}
.btn:hover{background:#d35400;transform:translateY(-1px)}
.btn.s{background:#2c3e50}.btn.s:hover{background:#1a252f}
#prog{flex:1;max-width:280px;height:5px;background:rgba(255,255,255,0.15);border-radius:3px;overflow:hidden;cursor:pointer}
#pf{height:100%;background:#e67e22;width:0%;transition:width 0.5s linear}
#sct{color:rgba(255,255,255,0.5);font-size:12px}
#music-note{color:rgba(255,255,255,0.3);font-size:11px;text-align:center;margin-top:6px}

@keyframes sweep{0%,100%{transform:rotate(-14deg) translateX(-2px)}50%{transform:rotate(14deg) translateX(2px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes drag{0%,100%{transform:translateX(0) rotate(0)}30%{transform:translateX(-4px) rotate(-2deg)}70%{transform:translateX(3px) rotate(1.5deg)}}
@keyframes walk{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes cel{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(-5deg) translateY(-6px)}70%{transform:rotate(5deg) translateY(-5px)}}
@keyframes think{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.015)}}
@keyframes tool{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(18deg) translateY(-4px)}}
@keyframes pop{0%{opacity:0;transform:scale(0.2) rotate(-15deg)}60%{transform:scale(1.25) rotate(5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes slup{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes swt{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:0.85;transform:translateY(8px)}}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(270px)}}
@keyframes whlspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes glowpulse{0%,100%{opacity:0.6}50%{opacity:1}}
@keyframes confetti{0%{opacity:0;transform:translateY(0) rotate(0)}100%{opacity:1;transform:translateY(30px) rotate(720deg)}}
</style>
</head>
<body>
<div id="wrap">
  <h1>🔧 PROJETO: ARMÁRIO COM RODAS — Animação Educacional 2D</h1>
  <div id="stage-box">
    <svg id="stage" viewBox="0 0 900 506" xmlns="http://www.w3.org/2000/svg">
      <g id="bg"></g>
      <g id="prop"></g>
      <g id="chr"></g>
      <g id="fx"></g>
    </svg>
    <div id="slbl"></div>
    <div id="dlg-wrap"><div id="spk"></div><div id="txt"></div></div>
  </div>
  <div id="ctrl">
    <button class="btn s" onclick="prevS()">&#9664; Anterior</button>
    <button class="btn" id="pbtn" onclick="togPlay()">&#9646;&#9646; Pausar</button>
    <button class="btn s" onclick="nextS()">Próximo &#9654;</button>
    <div id="prog" onclick="seekProg(event)"><div id="pf"></div></div>
    <span id="sct">1 / 10</span>
  </div>
  <div id="music-note">♪ Reproduza uma música ambiente suave ao fundo para melhor experiência</div>
</div>

<!-- Emergency sign -->
<rect x="170" y="62" width="64" height="20" rx="3" fill="#4caf50"/>
<rect x="172" y="64" width="60" height="16" rx="2" fill="#388e3c"/>
<text x="202" y="75" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="white">SAÍDA DE</text>

// ============================================================
// CABINET DRAWING
// ============================================================
function cabinet({x,y=390,wheels=false,id='cab',glow=false}) {
  const w=88, h=112;
  const by=wheels?-16:0;
  return `<g id="${id}" transform="translate(${x},${y})">
${wheels?`
<rect x="${-w/2-6}" y="-11" width="${w+12}" height="10" rx="3" fill="#546e7a"/>
<g id="${id}-wl"><circle cx="${-w/2+12}" cy="2" r="13" fill="#37474f" stroke="#263238" stroke-width="2.5"/><circle cx="${-w/2+12}" cy="2" r="5" fill="#607d8b"/><line x1="${-w/2+12}" y1="-10" x2="${-w/2+12}" y2="14" stroke="#546e7a" stroke-width="1.5"/><line x1="${-w/2+3}" y1="2" x2="${-w/2+21}" y2="2" stroke="#546e7a" stroke-width="1.5"/></g>
<g id="${id}-wr"><circle cx="${w/2-12}" cy="2" r="13" fill="#37474f" stroke="#263238" stroke-width="2.5"/><circle cx="${w/2-12}" cy="2" r="5" fill="#607d8b"/><line x1="${w/2-12}" y1="-10" x2="${w/2-12}" y2="14" stroke="#546e7a" stroke-width="1.5"/><line x1="${w/2-21}" y1="2" x2="${w/2-3}" y2="2" stroke="#546e7a" stroke-width="1.5"/></g>
`:''}
<rect x="${-w/2}" y="${-h+by}" width="${w}" height="${h}" rx="6" fill="#78909c" stroke="#546e7a" stroke-width="2.5"/>
<line x1="1" y1="${-h+5+by}" x2="1" y2="${by-4}" stroke="#546e7a" stroke-width="2"/>
<rect x="-7" y="${-h/2-10+by}" width="5" height="22" rx="2" fill="#90a4ae"/>
<rect x="2" y="${-h/2-10+by}" width="5" height="22" rx="2" fill="#90a4ae"/>
<rect x="${-w/2}" y="${-h+15+by}" width="10" height="6" rx="1" fill="#546e7a"/>
<rect x="${-w/2}" y="${-h/2+by}" width="10" height="6" rx="1" fill="#546e7a"/>
<rect x="${w/2-10}" y="${-h+15+by}" width="10" height="6" rx="1" fill="#546e7a"/>
<rect x="${w/2-10}" y="${-h/2+by}" width="10" height="6" rx="1" fill="#546e7a"/>
<rect x="${-w/2-5}" y="${-h-8+by}" width="${w+10}" height="11" rx="4" fill="#607d8b"/>
${glow?`<rect x="${-w/2-10}" y="${-h-14+by}" width="${w+20}" height="${h+22}" rx="9" fill="none" stroke="#f39c12" stroke-width="4" stroke-dasharray="9,5" style="animation:glowpulse 1.2s ease-in-out infinite"/>`:''}
</g>`;
}

// ============================================================
// CHARACTER DRAWING
// ============================================================
function char({id,x,y=390,shirt,hair,face='smile',act='idle',fl=1,isProf=false,broom=false,blueprint=false,wrench=false,hi=false}) {
  // Dimensions (y=0 is floor, values negative = upward)
  const BW=38,AW=11;
  const bt1=-22; // boot top
  const lt1=-60; // leg top
  const bl=-65;  // belt top
  const bd1=-115;// body top
  const nk=-126; // neck top
  const hcy=-153;// head center
  const hr=25;   // head radius
  const at=bd1+8;// arm top
  const ah=36;   // arm height

  // Arm rotations by action
  let rl=0,rr=0;
  if(act==='sweep'){rl=-28;rr=18;}
  if(act==='drag'){rl=-55;rr=-42;}
  if(act==='point'){rl=20;rr=55;}
  if(act==='cel'){rl=-75;rr=-75;}
  if(act==='think'){rl=0;rr=-35;}
  if(act==='work'){rl=-35;rr=-22;}

  // Mouth paths
  const my=hcy+17;
  let mouth='';
  if(face==='smile')mouth=`<path d="M-7,${my} Q0,${my+7} 7,${my}" stroke="#8d5a30" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  else if(face==='worried')mouth=`<path d="M-7,${my+5} Q0,${my-1} 7,${my+5}" stroke="#8d5a30" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  else if(face==='surprised')mouth=`<ellipse cx="0" cy="${my+2}" rx="5" ry="5" fill="#8d5a30"/>`;
  else if(face==='open')mouth=`<path d="M-8,${my} Q0,${my+10} 8,${my}" stroke="#8d5a30" stroke-width="2.5" fill="rgba(180,80,60,0.2)" stroke-linecap="round"/>`;
  else mouth=`<path d="M-7,${my} Q0,${my+7} 7,${my}" stroke="#8d5a30" stroke-width="2" fill="none" stroke-linecap="round"/>`;

  // Sweat drops for drag
  const sweat=act==='drag'?`
<ellipse cx="36" cy="${hcy-22}" rx="3.5" ry="6" fill="#7fd8e8" opacity="0.85" style="animation:swt 1s 0s ease-in-out infinite"/>
<ellipse cx="46" cy="${hcy-8}" rx="2.5" ry="5" fill="#7fd8e8" opacity="0.65" style="animation:swt 1s 0.3s ease-in-out infinite"/>
`:'';

  // Effort lines for drag
  const effortLines=act==='drag'?`
<line x1="${-BW/2-14}" y1="${hcy-15}" x2="${-BW/2-24}" y2="${hcy-10}" stroke="#f39c12" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
<line x1="${-BW/2-10}" y1="${hcy-5}" x2="${-BW/2-22}" y2="${hcy-2}" stroke="#f39c12" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
`:'';

  // Broom prop
  const broomSvg=broom?`
<g class="broom-g">
<line x1="${BW/2+AW-2}" y1="${at+12}" x2="${BW/2+AW+26}" y2="-4" stroke="#a1887f" stroke-width="5.5" stroke-linecap="round"/>
<rect x="${BW/2+AW+8}" y="-9" width="34" height="13" rx="4" fill="#8d6e63"/>
${Array.from({length:5},(_,i)=>`<line x1="${BW/2+AW+10+i*5}" y1="-7" x2="${BW/2+AW+10+i*5}" y2="4" stroke="#6d4c41" stroke-width="1.5"/>`).join('')}
</g>
`:'';

  // Blueprint prop
  const bpSvg=blueprint?`
<g transform="rotate(-12, ${-BW/2-AW/2}, ${at+ah+6})">
<rect x="${-BW/2-AW-28}" y="${at+ah-2}" width="36" height="28" rx="3" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
<rect x="${-BW/2-AW-26}" y="${at+ah+1}" width="32" height="22" rx="2" fill="#1976d2"/>
<line x1="${-BW/2-AW-24}" y1="${at+ah+7}" x2="${-BW/2-AW-6}" y2="${at+ah+7}" stroke="white" stroke-width="1"/>
<line x1="${-BW/2-AW-24}" y1="${at+ah+12}" x2="${-BW/2-AW-6}" y2="${at+ah+12}" stroke="white" stroke-width="1"/>
<rect x="${-BW/2-AW-23}" y="${at+ah+15}" width="12" height="6" rx="1" fill="none" stroke="white" stroke-width="1"/>
</g>
`:'';

  // Wrench prop
  const wrSvg=wrench?`
<g transform="rotate(-18, ${BW/2+AW/2}, ${at+ah})">
<line x1="${BW/2+AW-3}" y1="${at+ah-4}" x2="${BW/2+AW+22}" y2="${at+ah+24}" stroke="#607d8b" stroke-width="4.5" stroke-linecap="round"/>
<ellipse cx="${BW/2+AW-6}" cy="${at+ah-8}" rx="7" ry="5" fill="none" stroke="#607d8b" stroke-width="3"/>
</g>
`:'';

  // Highlight ring
  const hiSvg=hi?`<ellipse cx="0" cy="-2" rx="32" ry="10" fill="none" stroke="#f39c12" stroke-width="3" stroke-dasharray="7,4" style="animation:glowpulse 1.4s ease-in-out infinite"/>`:'';

  // Prof coat details
  const profDet=isProf?`
<line x1="2" y1="${bd1+6}" x2="2" y2="${bl-2}" stroke="#ddd" stroke-width="1.5"/>
<rect x="-15" y="${bd1+20}" width="11" height="4" rx="1" fill="#e53935"/>
<rect x="-15" y="${bd1+26}" width="11" height="3.5" rx="1" fill="#1e88e5"/>
`:'';

function bulb(x,y){return `<g style="animation:pop 0.55s ease-out both">
<circle cx="${x}" cy="${y}" r="19" fill="#fff176" stroke="#f9a825" stroke-width="2.5"/>
${Array.from({length:8},(_,i)=>{const a=i*45*(Math.PI/180),r1=22,r2=32;return `<line x1="${x+r1*Math.cos(a)}" y1="${y+r1*Math.sin(a)}" x2="${x+r2*Math.cos(a)}" y2="${y+r2*Math.sin(a)}" stroke="#f9a825" stroke-width="2.5" stroke-linecap="round"/>`;}).join('')}
<text x="${x}" y="${y+5}" text-anchor="middle" font-size="15">💡</text>
</g>`;}

function tick(x,y,delay=0){return `<g style="animation:pop 0.5s ${delay}s ease-out both">
<circle cx="${x}" cy="${y}" r="20" fill="#4caf50"/>
<polyline points="${x-10},${y} ${x-3},${y+9} ${x+11},${y-8}" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>`;}

function star(x,y,sz=20,clr='#f1c40f',delay=0){return `<text x="${x}" y="${y}" font-size="${sz}" text-anchor="middle" style="animation:pop 0.5s ${delay}s both">⭐</text>`;}

function ptArrowBig(x,y){return `<g style="animation:slup 0.5s ease-out both">
<text x="${x}" y="${y}" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#e53935">⚠️ PISO DESGASTADO!</text>
<line x1="${x}" y1="${y+6}" x2="${x}" y2="${y+44}" stroke="#e53935" stroke-width="3.5" stroke-linecap="round"/>
<polygon points="${x},${y+55} ${x-9},${y+42} ${x+9},${y+42}" fill="#e53935"/>
</g>`;}

function blackboard(x,y,w,h){return `
<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#2e7d32" stroke="#1b5e20" stroke-width="3"/>
<rect x="${x+6}" y="${y+6}" width="${w-12}" height="${h-12}" rx="3" fill="#388e3c"/>
<rect x="${x}" y="${y+h}" width="${w}" height="12" rx="3" fill="#4e342e"/>
`;}

// ============================================================
let cur=0,playing=true,advT=null,twT=null,dlgT=null;
const dlgW=document.getElementById('dlg-wrap');
const spkEl=document.getElementById('spk');
const txtEl=document.getElementById('txt');
const slblEl=document.getElementById('slbl');
const pbtnEl=document.getElementById('pbtn');
const pfEl=document.getElementById('pf');
const sctEl=document.getElementById('sct');

function showScene(i){
  clearTimeout(advT);clearTimeout(twT);clearTimeout(dlgT);
  cur=Math.max(0,Math.min(scenes.length-1,i));
  const s=scenes[cur];
  // Fade stage briefly
  ['bg','prop','chr','fx'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.style.opacity='0';el.style.transition='opacity 0.35s';}
  });
  setTimeout(()=>{
    s.go();
    ['bg','prop','chr','fx'].forEach(id=>{
      const el=document.getElementById(id);
      if(el){el.style.opacity='1';}
    });
  },320);

  // Label
  slblEl.textContent=s.title;
  slblEl.classList.add('vis');
  setTimeout(()=>slblEl.classList.remove('vis'),2800);

  // Dialogue
  dlgW.classList.remove('show');
  spkEl.textContent='';txtEl.textContent='';
  if(s.dlg){
    dlgT=setTimeout(()=>{
      spkEl.textContent=s.dlg.spk;
      dlgW.classList.add('show');
      typewrite(txtEl,s.dlg.txt,48);
    },1400);
  }

  // Progress
  pfEl.style.width=`${((cur+1)/scenes.length)*100}%`;
  sctEl.textContent=`${cur+1} / ${scenes.length}`;
  pbtnEl.innerHTML=playing?'&#9646;&#9646; Pausar':'&#9654; Play';

  // Auto-advance
  if(playing){
    advT=setTimeout(()=>{
      if(cur<scenes.length-1)showScene(cur+1);
      else{playing=false;pbtnEl.innerHTML='&#9654; Reiniciar';}
    },s.dur);
  }
}

function typewrite(el,text,speed){
  let i=0;el.textContent='';
  function tick(){
    if(i<text.length){el.textContent+=text[i];i++;twT=setTimeout(tick,speed);}
  }
  tick();
}

function togPlay(){
  if(cur>=scenes.length-1&&!playing){playing=true;showScene(0);return;}
  playing=!playing;
  pbtnEl.innerHTML=playing?'&#9646;&#9646; Pausar':'&#9654; Play';
  if(playing){
    advT=setTimeout(()=>{if(cur<scenes.length-1)showScene(cur+1);},Math.floor(scenes[cur].dur*0.55));
  }else{clearTimeout(advT);}
}
function nextS(){if(cur<scenes.length-1)showScene(cur+1);}
function prevS(){if(cur>0)showScene(cur-1);}
function seekProg(e){
  const r=e.currentTarget.getBoundingClientRect();
  const ratio=(e.clientX-r.left)/r.width;
  showScene(Math.floor(ratio*scenes.length));
}

// Start
showScene(0);
</script>
</body>
</html>
